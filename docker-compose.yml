# Base de datos PostgreSQL 15 para desarrollo local.
# Levantar:  docker compose up -d
# Detener:   docker compose stop
services:
  db:
    image: postgres:15
    container_name: jobmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch_secret
    ports:
      - "5432:5432"
    volumes:
      - jobmatch-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Servidor de correo de PRUEBA (SMTP). Atrapa todos los correos que envía la app
  # y los muestra en http://localhost:8025 — no envía nada a personas reales.
  mail:
    image: axllent/mailpit:latest
    container_name: jobmatch-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (lo usa Laravel)
      - "8025:8025"   # Bandeja web

volumes:
  jobmatch-pgdata:
