# Base de datos PostgreSQL 15 para desarrollo local.
# Levantar:  docker compose up -d
# Detener:   docker compose stop
services:
  db:
    image: postgres:15
    container_name: ludan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ludan
      POSTGRES_USER: ludan
      POSTGRES_PASSWORD: ludan_secret
    ports:
      - "5432:5432"
    volumes:
      - ludan-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Servidor de correo de PRUEBA (SMTP). Atrapa todos los correos que envía la app
  # y los muestra en http://localhost:8025 — no envía nada a personas reales.
  mail:
    image: axllent/mailpit:latest
    container_name: ludan-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (lo usa Laravel)
      - "8025:8025"   # Bandeja web

  # pgAdmin (opcional): administrador visual de la base de datos y diagrama ER.
  # No arranca con "docker compose up -d". Para usarlo:
  #   docker compose --profile herramientas up -d pgadmin
  # y abre http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ludan-pgadmin
    profiles: ["herramientas"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ludan.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  ludan-pgdata:
